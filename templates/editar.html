
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar canción</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <h1>Editar canción</h1>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <p class="{{ categoria }}">{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="codigo">Código:</label>
        <input
            type="number"
            id="codigo"
            value="{{ cancion.codigo }}"
            disabled
        >
        <br><br>

        <label for="titulo">Título:</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            value="{{ cancion.titulo }}"
            maxlength="200"
            required
        >
        <br><br>

        <label for="artista">Artista:</label>
        <input
            type="text"
            id="artista"
            name="artista"
            value="{{ cancion.artista }}"
            maxlength="150"
            required
        >
        <br><br>

        <label for="album">Álbum:</label>
        <input
            type="text"
            id="album"
            name="album"
            value="{{ cancion.album }}"
            maxlength="200"
            required
        >
        <br><br>

        <label for="anio">Año:</label>
        <input
            type="number"
            id="anio"
            name="anio"
            value="{{ cancion.anio }}"
            min="1"
            max="2100"
            required
        >
        <br><br>

        <label for="duracion">Duración en segundos:</label>
        <input
            type="number"
            id="duracion"
            name="duracion"
            value="{{ cancion.duracion }}"
            min="1"
            required
        >
        <br><br>

        <label for="genero">Género musical:</label>
        <select id="genero" name="genero" required>
            {% set generos = [
                "Rock Argentino",
                "Rock internacional",
                "Pop",
                "Folclore",
                "Jazz",
                "Clásica",
                "Electrónica",
                "Otro",
                "Sin especificar"
            ] %}

            {% for genero in generos %}
                <option
                    value="{{ genero }}"
                    {% if cancion.genero == genero %}selected{% endif %}
                >
                    {{ genero }}
                </option>
            {% endfor %}

            {% if cancion.genero not in generos %}
                <option value="{{ cancion.genero }}" selected>
                    {{ cancion.genero }}
                </option>
            {% endif %}
        </select>
        <br><br>

        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('inicio') }}">Cancelar</a>

    </form>
</body>
</html>
